name: Release

# Релиз создаётся при пуше тега вида v1.1.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill manifest (version and URLs)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" --arg repo "$GITHUB_REPOSITORY" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($repo)"
            | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json"
            | .download = "https://github.com/\($repo)/releases/download/\($tag)/module.zip"
          ' module.json > module.tmp
          mv module.tmp module.json

      - name: Package
        run: zip -r module.zip module.json README.md scripts styles languages skins

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
